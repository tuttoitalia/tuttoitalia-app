name: Bozze guide servizi

# Scrive le bozze delle guide in scaletta (supabase/servizi.sql, tabella guide)
# per i servizi in preparazione o lanciati e le passa in revisione. Senza
# tabelle o senza guide da scrivere esce subito, senza chiamare l'API.
on:
  schedule:
    - cron: '0 5 * * 2'   # martedi' 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prova senza scrivere (1 = dry run, 0 = reale)"
        default: '0'
        required: false
      guida:
        description: "Slug di una sola guida (vuoto = le prossime in scaletta)"
        default: ''
        required: false

jobs:
  bozze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrivi le bozze e passale in revisione
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GUIDA: ${{ github.event.inputs.guida }}
        run: node guide-bozze.mjs
